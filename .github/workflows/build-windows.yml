name: Build Windows executable

# Publishes two downloads as the rolling "latest" release:
#
#   OSINT-Lookup-windows.zip   one-folder build  (recommended)
#   OSINT-Lookup.exe           one-file build    (convenient, but see below)
#
# The one-file build is the one antivirus engines dislike. Its bootloader
# unpacks a payload into a temp directory and runs it, which is exactly what a
# malware dropper does, so heuristics fire on a perfectly clean binary. The
# one-folder build does no runtime self-extraction and is flagged far less.
on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to publish the release asset

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install PyInstaller with a locally compiled bootloader
        shell: bash
        run: |
          # The bootloader shipped in the public PyInstaller wheel is byte-identical
          # for everyone, and because a great deal of real malware is built with
          # stock PyInstaller, several engines simply signature that bootloader.
          # Compiling it here produces different bytes and sidesteps that specific
          # class of false positive. If the source build fails on the runner we
          # fall back to the wheel rather than failing the release.
          if python -m pip install --no-binary :all: --no-cache-dir pyinstaller; then
            echo "bootloader compiled from source"
            echo "compiled-from-source" > bootloader.status
          else
            echo "::warning::source build of PyInstaller failed; falling back to the prebuilt wheel"
            python -m pip install --force-reinstall pyinstaller
            echo "prebuilt-wheel" > bootloader.status
          fi
          python -m PyInstaller --version

      # Runs on the real target OS, so this also covers the Windows-only paths
      # (%APPDATA% resolution, reserved device names, CRLF report output).
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build one-folder (recommended)
        shell: pwsh
        env:
          OSINT_ONEDIR: "1"
        run: python -m PyInstaller --noconfirm --clean --distpath dist-onedir --workpath build-onedir packaging/osint_lookup.spec

      - name: Build one-file
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --distpath dist-onefile --workpath build-onefile packaging/osint_lookup.spec

      # Proves the frozen build actually starts on Windows, rather than only
      # that PyInstaller produced a file. A packaging mistake usually shows up
      # as an immediate exit.
      - name: Smoke-test both builds
        shell: pwsh
        run: |
          foreach ($exe in @("dist-onedir/OSINT-Lookup/OSINT-Lookup.exe", "dist-onefile/OSINT-Lookup.exe")) {
            if (-not (Test-Path $exe)) { throw "missing build output: $exe" }
            "Launching $exe ..."
            $p = Start-Process -FilePath $exe -PassThru
            Start-Sleep -Seconds 15
            if ($p.HasExited) { throw "$exe exited immediately with code $($p.ExitCode)" }
            Stop-Process -Id $p.Id -Force
            "  started and stayed running - OK"
          }

      - name: Package and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path dist-onedir/OSINT-Lookup/* -DestinationPath dist/OSINT-Lookup-windows.zip -Force
          Copy-Item dist-onefile/OSINT-Lookup.exe dist/OSINT-Lookup.exe -Force

          Remove-Item dist/SHA256SUMS.txt -ErrorAction SilentlyContinue
          foreach ($f in @("OSINT-Lookup-windows.zip", "OSINT-Lookup.exe")) {
            $h = (Get-FileHash "dist/$f" -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item "dist/$f").Length
            "{0}  {1}" -f $h, $f | Out-File -Append -Encoding ascii dist/SHA256SUMS.txt
            "{0}: {1:N1} MB  {2}" -f $f, ($size / 1MB), $h
            if ($size -lt 5MB) { throw "$f is suspiciously small ($size bytes)" }
          }

      - name: Write build provenance
        shell: bash
        run: |
          {
            echo "OSINT Lookup - build provenance"
            echo "==============================="
            echo
            echo "Built            : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "Repository       : ${GITHUB_REPOSITORY}"
            echo "Commit           : ${GITHUB_SHA}"
            echo "Workflow run     : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "Runner           : ${RUNNER_OS} ${RUNNER_ARCH}"
            echo "Python           : $(python --version 2>&1)"
            echo "PyInstaller      : $(python -m PyInstaller --version 2>&1)"
            echo "Bootloader       : $(cat bootloader.status 2>/dev/null || echo unknown)"
            echo "UPX compression  : disabled (a known AV heuristic trigger)"
            echo "Code signing     : none (requires a paid certificate)"
            echo
            echo "Everything here was produced by public CI from the commit above."
            echo "The full log is at the workflow run URL and is readable by anyone."
            echo "To reproduce locally: clone the repo at that commit, run build_windows.bat."
            echo
            echo "Checksums are in SHA256SUMS.txt."
          } > dist/BUILDINFO.txt
          cat dist/BUILDINFO.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OSINT-Lookup-windows
          path: |
            dist/OSINT-Lookup-windows.zip
            dist/OSINT-Lookup.exe
            dist/SHA256SUMS.txt
            dist/BUILDINFO.txt
          retention-days: 90
          if-no-files-found: error

      # A rolling "latest" release keeps the download URLs stable across builds.
      - name: Publish the latest release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python -c "import osintapp; print(osintapp.__version__)")
          NOTES=$(cat <<EOF
          Windows build of OSINT Lookup v${VERSION}.

          ## Which file?

          **\`OSINT-Lookup-windows.zip\` - recommended.** Unzip it anywhere and run
          \`OSINT-Lookup.exe\` from inside the folder. Keep the folder together; the
          .exe needs the files beside it.

          \`OSINT-Lookup.exe\` is the same app packed into a single file. It is more
          convenient, but antivirus engines frequently flag single-file PyInstaller
          binaries: the bootloader unpacks a payload into a temp directory and
          executes it, which is behaviourally identical to a malware dropper. If your
          AV objects to it, use the .zip instead - it does no runtime self-extraction
          and is flagged far less often.

          ## Both are unsigned

          Code signing needs a paid certificate, so Windows SmartScreen will warn on
          first run: **More info -> Run anyway**.

          If you would rather not trust a binary from a stranger - a reasonable
          position for an OSINT tool - don't. Every build is produced in public CI
          from the source in this repository; the full log for this one is at
          \`${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\`,
          built from commit \`${GITHUB_SHA}\`. You can also clone the repo and run
          \`build_windows.bat\`, or skip packaging entirely and run \`run.bat\` against
          your own Python.

          Checksums for both files are in \`SHA256SUMS.txt\`.
          EOF
          )
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest \
            dist/OSINT-Lookup-windows.zip dist/OSINT-Lookup.exe \
            dist/SHA256SUMS.txt dist/BUILDINFO.txt \
            --title "OSINT Lookup v${VERSION} (latest build)" \
            --notes "${NOTES}"
